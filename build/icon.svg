<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 装饰光斑 -->
  <circle cx="100" cy="80" r="120" fill="#fff" fill-opacity="0.06"/>
  <circle cx="440" cy="460" r="100" fill="#fff" fill-opacity="0.04"/>

  <!-- 学士帽 -->
  <g transform="translate(256, 200)" filter="url(#shadow)">
    <!-- 帽子底座 -->
    <path d="M -110 20 L 0 -20 L 110 20 L 0 60 Z" fill="url(#cap)"/>
    <!-- 帽顶方块 -->
    <rect x="-55" y="-30" width="110" height="35" rx="4" fill="url(#cap)"/>
    <!-- 帽顶平面 -->
    <path d="M -80 -25 L 0 -55 L 80 -25 L 0 5 Z" fill="#4338ca"/>
    <!-- 帽顶高光 -->
    <path d="M -80 -25 L 0 -55 L 80 -25 L 0 5 Z" fill="#fff" fill-opacity="0.08"/>
    <!-- 流苏绳 -->
    <path d="M 55 -22 Q 70 0 72 40" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 流苏球 -->
    <circle cx="72" cy="48" r="8" fill="url(#tassel)"/>
    <!-- 流苏穗 -->
    <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
      <line x1="72" y1="56" x2="68" y2="72"/>
      <line x1="72" y1="56" x2="72" y2="75"/>
      <line x1="72" y1="56" x2="76" y2="72"/>
    </g>
  </g>

  <!-- 课程表卡片 -->
  <g transform="translate(116, 310)" filter="url(#shadow)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="280" height="130" rx="20" ry="20" fill="#ffffff"/>
    <!-- 卡片标题栏 -->
    <rect x="0" y="0" width="280" height="36" rx="20" ry="20" fill="#f3f4f6"/>
    <rect x="0" y="18" width="280" height="18" fill="#f3f4f6"/>

    <!-- 标题文字 -->
    <text x="18" y="25" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6b7280">COURSE</text>
    <circle cx="260" cy="18" r="5" fill="#22c55e"/>

    <!-- 课程色块 -->
    <rect x="16" y="48" width="70" height="28" rx="6" fill="#3b82f6"/>
    <rect x="94" y="48" width="70" height="28" rx="6" fill="#f59e0b"/>
    <rect x="172" y="48" width="70" height="28" rx="6" fill="#ec4899"/>

    <rect x="16" y="84" width="70" height="28" rx="6" fill="#22c55e"/>
    <rect x="94" y="84" width="70" height="28" rx="6" fill="#8b5cf6"/>
    <rect x="172" y="84" width="70" height="28" rx="6" fill="#06b6d4"/>
  </g>

  <!-- AI 星标 -->
  <g transform="translate(372, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#fff" fill-opacity="0.95"/>
    <text x="0" y="6" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="middle">AI</text>
  </g>
</svg>
